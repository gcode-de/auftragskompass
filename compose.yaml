name: auftragskompass
services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ak
      POSTGRES_DB: auftragskompass
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U ak -d auftragskompass']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: runtime
    command: [node, apps/api/dist/main.js]
    user: '${AK_UID:-1000}:${AK_GID:-1000}'
    secrets: [db_password]
    environment:
      AK_DB_HOST: database
      AK_DB_NAME: auftragskompass
      AK_DB_USER: ak
      AK_DB_PASSWORD_FILE: /run/secrets/db_password
      AK_LOG_LEVEL: ${AK_LOG_LEVEL:-info}
      AK_TIMEZONE: ${AK_TIMEZONE:-Europe/Berlin}
      AK_BUILD_REVISION: ${AK_BUILD_REVISION:-development}
      AK_HOST: 0.0.0.0
      AK_PORT: 3000
    depends_on:
      database: { condition: service_healthy }
    ports: ['127.0.0.1:${AK_API_PORT:-3100}:3000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: runtime
    command: [node, apps/worker/dist/main.js]
    user: '${AK_UID:-1000}:${AK_GID:-1000}'
    secrets: [db_password]
    environment:
      AK_DB_HOST: database
      AK_DB_NAME: auftragskompass
      AK_DB_USER: ak
      AK_DB_PASSWORD_FILE: /run/secrets/db_password
      AK_LOG_LEVEL: ${AK_LOG_LEVEL:-info}
      AK_TIMEZONE: ${AK_TIMEZONE:-Europe/Berlin}
      AK_BUILD_REVISION: ${AK_BUILD_REVISION:-development}
      AK_HOST: 0.0.0.0
      AK_PORT: 3001
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped
  admin:
    depends_on:
      api: { condition: service_healthy }
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: admin
    ports: ['127.0.0.1:${AK_ADMIN_PORT:-8080}:8080']
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  database:
secrets:
  db_password:
    file: ${AK_DB_PASSWORD_FILE:?Set absolute path to an external password file}
