server {
    listen 8080;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    location /auth/ { proxy_pass http://api:3000; }
    location /api/ { proxy_pass http://api:3000; }
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
}
