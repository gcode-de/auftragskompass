map $uri $ak_widget_origin {
    default "";
    /inquiry-widget/inquiry-widget.js "*";
    /inquiry-widget/inquiry-widget.css "*";
}

server {
    listen 8080;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    location /auth/ { proxy_pass http://api:3000; }
    location /api/ { proxy_pass http://api:3000; }
    location /feeds/v1/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin $ak_widget_origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
}
