map $uri $ak_widget_origin {
    default "";
    /inquiry-widget/inquiry-widget.js "*";
    /inquiry-widget/inquiry-widget.css "*";
}

# The app shell must be revalidated on every load, or a browser or proxy keeps
# showing the previous release after an update. Hashed assets and the API
# keep their own caching.
map $uri $ak_cache_control {
    default "no-cache";
    ~^/assets/ "";
    ~^/(api|auth|feeds)/ "";
}

# Only the frozen document PDF may be framed, and only by the admin itself:
# the delivery dialog shows it beside its actions. Everything else stays
# unframeable.
map $uri $ak_frame_options {
    default DENY;
    ~^/api/v1/documents/[0-9a-f-]+/pdf$ SAMEORIGIN;
}

map $uri $ak_frame_ancestors {
    default "'none'";
    ~^/api/v1/documents/[0-9a-f-]+/pdf$ "'self'";
}

server {
    listen 8080;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    location /auth/ { proxy_pass http://api:3000; }
    location /api/ { proxy_pass http://api:3000; }
    location /feeds/v1/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin $ak_widget_origin always;
    add_header Cache-Control $ak_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options $ak_frame_options always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors $ak_frame_ancestors" always;
    location / { try_files $uri $uri/ /index.html; }
}
